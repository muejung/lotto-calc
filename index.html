<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณค่าหวย</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2 sm:p-5">
    <div class="max-w-4xl mx-auto bg-white p-4 sm:p-8 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">โปรแกรมคำนวณค่าหวย</h1>
        <textarea id="numbers" class="w-full h-48 p-2 border rounded" placeholder="ใส่เลขที่จะซื้อ คั่นด้วยคอมม่า(,) เช่น 12,34,123 หรือ ช่องว่าง เช่น 56 78 567&#10;หรือขึ้นบรรทัดใหม่ เช่น&#10;89&#10;90&#10;890&#10;&#10;**ถ้ามีการใส่เลขซ้ำ ระบบจะทำการตัดออกให้เป็นเลขชุดเดียวโดยอัตโนมัติ"></textarea>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1" for="price2_top">2 ตัวบน (บาท)</label>
                <input type="number" id="price2_top" value="25" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1" for="price2_bottom">2 ตัวล่าง (บาท)</label>
                <input type="number" id="price2_bottom" value="25" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1" for="price3_straight">3 ตัวบน (บาท)</label>
                <input type="number" id="price3_straight" value="10" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1" for="price3_tod">3 ตัวโต๊ด (บาท)</label>
                <input type="number" id="price3_tod" value="10" class="w-full p-2 border rounded">
            </div>
        </div>
        
        <div class="mt-4 flex flex-wrap gap-4">
            <div class="flex items-center">
                <input type="checkbox" id="autoReverse" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="autoReverse" class="ml-2 block text-sm font-medium text-gray-700">กลับเลข 2 ตัวอัตโนมัติ</label>
            </div>
            <div class="flex items-center">
                <input type="checkbox" id="autoReverse3" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="autoReverse3" class="ml-2 block text-sm font-medium text-gray-700">กลับเลข 3 ตัว (6 กลับ)</label>
            </div>
            
        </div>

        <div class="mt-4 flex gap-4">
            <button onclick="calculate()" class="bg-blue-600 text-white px-6 py-2 rounded">คำนวณ</button>
            <button onclick="clearData()" class="bg-gray-500 text-white px-6 py-2 rounded">ล้างข้อมูล</button>
        </div>
        
        <div id="result" class="mt-6"></div>
    </div>

    <footer class="mt-8 mb-2 text-center text-sm text-gray-400">
        <p>&copy;2026 | Designed & Developed by muejung</p>
    </footer>

    <script>
    function calculate() {
        const input = document.getElementById('numbers').value;
        const price3Straight = Number(document.getElementById('price3_straight').value) || 0;
        const price3Tod = Number(document.getElementById('price3_tod').value) || 0;
        const price2Top = Number(document.getElementById('price2_top').value) || 0;
        const price2Bottom = Number(document.getElementById('price2_bottom').value) || 0;
        const isAutoReverse3 = document.getElementById('autoReverse3').checked;
        const isAutoReverse = document.getElementById('autoReverse').checked;
        const items = input.split(/[\s,]+/).filter(s => s !== "" && /^\d+$/.test(s)).sort((a, b) => Number(a) - Number(b));
        let threeDigits = new Set();
        let twoDigits = new Set();

        items.forEach(num => {
            if (num.length === 3) {
                if (isAutoReverse3) {
                    const [a, b, c] = num.split('');
                    threeDigits.add(a+b+c);
                    threeDigits.add(a+c+b);
                    threeDigits.add(b+a+c);
                    threeDigits.add(b+c+a);
                    threeDigits.add(c+a+b);
                    threeDigits.add(c+b+a);
                } else {
                    threeDigits.add(num);
                }
            } else if (num.length === 2) {
                twoDigits.add(num);
                if (isAutoReverse) {
                    twoDigits.add(num.split('').reverse().join(''));
                }
            }
        });

        const arr3 = Array.from(threeDigits);
        const arr2 = Array.from(twoDigits);

        const createList = (arr, price) => arr.map(num => `
            <div class="flex justify-end items-center mb-2 text-sm">
                <span class="text-gray-800 mr-4">${num}</span>
                <div class="flex items-center">
                    <input type="number" value="${price}" class="w-16 p-1 border rounded text-right item-price" oninput="updateTotal()">
                    <span class="ml-2 text-gray-600">บาท</span>
                </div>
            </div>
        `).join('');

        let html3Straight = createList(arr3, price3Straight);
        let html3Tod = createList(arr3, price3Tod);
        let html2Top = createList(arr2, price2Top);
        let html2Bottom = createList(arr2, price2Bottom);
        
        document.getElementById('result').innerHTML = `
            <div class="mb-4 p-4 bg-green-50 border border-green-200 rounded text-center shadow-sm">
                <p class="font-bold text-2xl text-green-700">ยอดรวมทั้งหมด: <span id="grandTotal">0</span> บาท</p>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-4 w-full">
                <div class="bg-gray-50 p-4 rounded border h-fit">
                    <h3 class="font-bold mb-4 pb-2 border-b text-gray-700 text-right">2 ตัวบน (${arr2.length} ชุด)</h3>
                    ${html2Top || '<p class="text-gray-400 text-sm text-center font-medium">ไม่มีข้อมูล</p>'}
                </div>
                <div class="bg-gray-50 p-4 rounded border h-fit">
                    <h3 class="font-bold mb-4 pb-2 border-b text-gray-700 text-right">2 ตัวล่าง (${arr2.length} ชุด)</h3>
                    ${html2Bottom || '<p class="text-gray-400 text-sm text-center font-medium">ไม่มีข้อมูล</p>'}
                </div>
                <div class="bg-gray-50 p-4 rounded border h-fit">
                    <h3 class="font-bold mb-4 pb-2 border-b text-gray-700 text-right">3 ตัวบน (${arr3.length} ชุด)</h3>
                    ${html3Straight || '<p class="text-gray-400 text-sm text-center font-medium">ไม่มีข้อมูล</p>'}
                </div>
                <div class="bg-gray-50 p-4 rounded border h-fit">
                    <h3 class="font-bold mb-4 pb-2 border-b text-gray-700 text-right">3 ตัวโต๊ด (${arr3.length} ชุด)</h3>
                    ${html3Tod || '<p class="text-gray-400 text-sm text-center font-medium">ไม่มีข้อมูล</p>'}
                </div>
            </div>
        `;

        updateTotal();
    }

    function updateTotal() {
        const inputs = document.querySelectorAll('.item-price');
        let total = 0;
        inputs.forEach(input => {
            total += Number(input.value) || 0;
        });
        document.getElementById('grandTotal').innerText = total;
    }

    function clearData() {
        document.getElementById('numbers').value = '';
        document.getElementById('result').innerHTML = '';
    }
    </script>
</body>
</html>
